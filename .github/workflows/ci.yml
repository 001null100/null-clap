name: CI

on:
  push:
    branches: [main, fix/bitwig-midi-routing]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: null-clap-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DNULLCLAP_BUILD_EXAMPLES=ON
          -DNULLCLAP_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Download clap-validator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-windows.zip" `
            -OutFile validator.zip
          Expand-Archive validator.zip -DestinationPath validator
          $validator = Get-ChildItem validator -Filter "clap-validator.exe" -Recurse | Select-Object -First 1
          if (-not $validator) { throw "clap-validator.exe not found in release archive" }

      - name: Validate examples and MIDI routing probes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $validator = Get-ChildItem validator -Filter "clap-validator.exe" -Recurse | Select-Object -First 1
          if (-not $validator) { throw "clap-validator.exe not found" }
          $modules = @("NullClapMinimalEffect.clap") + @(
            Get-ChildItem build/clap -Filter "NullClapMidiProbe*.clap" |
              Sort-Object Name |
              ForEach-Object { $_.Name }
          )
          if ($modules.Count -lt 10) { throw "Expected MinimalEffect plus nine MIDI probes" }
          foreach ($module in $modules) {
            & $validator.FullName validate "build/clap/$module" --only-failed
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Download clap-validator (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L "https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip" -o validator.zip
          unzip -q validator.zip -d validator-package
          ARCHIVE="$(find validator-package -type f -name '*.tar.gz' | head -n 1)"
          test -n "$ARCHIVE"
          mkdir -p validator
          tar -xzf "$ARCHIVE" -C validator

      - name: Validate examples and MIDI routing probes (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VALIDATOR="$(find validator -type f -name 'clap-validator' | head -n 1)"
          test -n "$VALIDATOR"
          chmod +x "$VALIDATOR"
          mapfile -t PROBES < <(find build/clap -maxdepth 1 -type f -name 'NullClapMidiProbe*.clap' -printf '%f\n' | sort)
          test "${#PROBES[@]}" -eq 9
          "$VALIDATOR" validate "build/clap/NullClapMinimalEffect.clap" --only-failed
          for module in "${PROBES[@]}"; do
            "$VALIDATOR" validate "build/clap/$module" --only-failed
          done

      - name: Upload example
        uses: actions/upload-artifact@v4
        with:
          name: NullClapMinimalEffect-${{ runner.os }}
          path: build/clap/NullClapMinimalEffect.clap

      - name: Upload Bitwig MIDI routing probes
        uses: actions/upload-artifact@v4
        with:
          name: NullClapMidiRoutingProbes-${{ runner.os }}
          path: |
            build/clap/NullClapMidiProbe*.clap
            examples/MidiRoleProbe/README.md

  diagnostic-release:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/bitwig-midi-routing'
    needs: build-and-validate
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download validated MIDI routing probes
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Bitwig diagnostic builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          test -d artifacts/NullClapMidiRoutingProbes-Windows
          test -d artifacts/NullClapMidiRoutingProbes-Linux
          (cd artifacts/NullClapMidiRoutingProbes-Windows && zip -qr ../../release/NullClapMidiRoutingProbes-Windows.zip .)
          (cd artifacts/NullClapMidiRoutingProbes-Linux && tar -czf ../../release/NullClapMidiRoutingProbes-Linux.tar.gz .)

      - name: Publish Bitwig diagnostic release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bitwig-midi-routing-diagnostic"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          cat > release-notes.md <<EOF
          Bitwig MIDI routing diagnostic build from commit ${GITHUB_SHA}.

          This prerelease contains nine CLAP probes. Probes 1-6 test descriptor/port role combinations; Probe 7 is the broad event sniffer; Probes 8-9 force MIDI1-only and MIDI-MPE-only note-port dialects to isolate Bitwig's controller-event negotiation. Both Windows and Linux packages come from jobs that passed the null-clap unit tests and clap-validator 0.4.1.

          Use examples/MidiRoleProbe/README.md inside either package for the test procedure.
          EOF

          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Bitwig MIDI Routing Diagnostic" \
            --notes-file release-notes.md \
            --prerelease

  release:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release:')
    needs: build-and-validate
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download validated examples
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package example builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          test -d artifacts/NullClapMinimalEffect-Windows
          test -d artifacts/NullClapMinimalEffect-Linux
          (cd artifacts/NullClapMinimalEffect-Windows && zip -qr ../../release/NullClapMinimalEffect-Windows.zip .)
          (cd artifacts/NullClapMinimalEffect-Linux && tar -czf ../../release/NullClapMinimalEffect-Linux.tar.gz .)

      - name: Publish versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/.*project\(null-clap VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -n 1)"
          test -n "$VERSION"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          cat > release-notes.md <<EOF
          null-clap ${TAG} is the first validator-backed framework release.

          Highlights:
          - C++20 CLAP-first plug-in base on the official CLAP API and clap-helpers
          - sample-accurate automation and monophonic modulation
          - stable native-unit parameters and GUI gestures
          - deterministic, versioned state with host parameter rescan on restore
          - declarative audio ports and remote controls
          - toolkit-independent GUI delegation
          - Windows and Linux builds validated by clap-validator 0.4.1

          The attached MinimalEffect builds are smoke-test/example CLAP modules, not a separate product.
          EOF

          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "null-clap ${TAG}" \
            --notes-file release-notes.md
