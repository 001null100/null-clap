name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: null-clap-sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitized
          -DNULLCLAP_BUILD_EXAMPLES=OFF
          -DNULLCLAP_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Test memory safety and contracts
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure
